plugins {
    id 'com.android.application'
}

android {
    namespace 'com.newplayerone.towrix'
    compileSdk 36

    defaultConfig {
        // ⚠️ El applicationId es el "nombre interno" de la app en Google Play.
        // Una vez que subas la app, NO se puede cambiar nunca.
        // Si al crear la app en Play Console te pide otro nombre de paquete, cámbialo AQUÍ antes de subirla.
        applicationId "com.newplayerone.towrix"
        minSdk 24
        targetSdk 36
        // Cada vez que subas una actualización: suma 1 a versionCode (2, 3, 4...)
        // y cambia versionName ("0.7", "1.0"...).
        versionCode 1
        versionName "1.0"

        // IDs de AdMob para la versión publicada (release): se leen de gradle.properties
        manifestPlaceholders = [
                admobAppId     : project.property('TOWRIX_ADMOB_APP_ID'),
                admobRewardedId: project.property('TOWRIX_ADMOB_REWARDED_ID')
        ]
    }

    buildTypes {
        debug {
            // Builds de prueba: SIEMPRE los IDs de prueba oficiales de Google (nunca hagas clic en tus anuncios reales)
            manifestPlaceholders = [
                    admobAppId     : 'ca-app-pub-3940256099942544~3347511713',
                    admobRewardedId: 'ca-app-pub-3940256099942544/5224354917'
            ]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // El juego es un solo archivo HTML dentro de assets/. Estas librerías son solo para los videos con recompensa.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'        // AdMob
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'   // consentimiento (Europa/Reino Unido)
}
