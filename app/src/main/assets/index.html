  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#12081f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #c{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:0;left:0;right:0;display:none;gap:6px;align-items:center;padding:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
  body[data-mode=game] #hud{display:flex}
  .pill{background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px;white-space:nowrap}
  #hud .sp{flex:1}
  .hbtn{pointer-events:auto;cursor:pointer}
  #bar{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:none;gap:6px;z-index:6;justify-content:center;flex-wrap:wrap;padding:0 6px}
  #bar.on{display:flex}
  .wb{position:relative;overflow:hidden;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);border-radius:14px;padding:5px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:50px;backdrop-filter:blur(4px)}
  .wb i{font-style:normal;font-size:22px;line-height:1.1}.wb span{font-size:10px;font-weight:800;letter-spacing:.02em}
  .wb small{font-size:10px;color:#ffd400;font-weight:800}
  .wb.sel{border-color:#c6ff00;background:rgba(198,255,0,.2)}
  .wb.self{border-style:dashed}
  .wb .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);pointer-events:none}
  .wb[disabled]{opacity:.4}
  #hint{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-weight:800;font-size:12px;letter-spacing:.05em;color:#fff;text-shadow:0 2px 0 #000;z-index:6;pointer-events:none;text-align:center;white-space:nowrap;display:none}
  body[data-mode=game] #hint{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;display:none;background:radial-gradient(circle at 50% 50%,rgba(5,0,15,0) 42vmin,rgba(5,0,15,.6) 78vmax)}
  body[data-mode=game][data-q=hi] #vig{display:block}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;text-align:center;max-width:90vw}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,4,20,.6);z-index:40;padding:14px}
  #ov.hide{display:none}
  .card{background:linear-gradient(160deg,#2a1440,#140a24);border:2px solid rgba(198,255,0,.35);border-radius:22px;padding:20px 16px 16px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;max-height:94vh;overflow:auto}
  .card h1{font:900 italic 30px/1.1 system-ui,sans-serif;margin-bottom:6px;letter-spacing:.03em}
  .card h2{font:900 italic 22px system-ui,sans-serif;margin-bottom:6px;letter-spacing:.04em}
  .card p{opacity:.9;line-height:1.45;margin:8px 0;font-size:15px}
  .sub{color:#c6ff00;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:12px 0 4px;text-align:left}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
  .chip{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  button.b{font:inherit;font-weight:900;font-style:italic;letter-spacing:.05em;font-size:17px;border:0;border-radius:14px;padding:13px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#ff2d95,#c2185b);box-shadow:0 4px 0 #6d0b35}
  button.b:active{transform:translateY(2px);box-shadow:0 2px 0 #6d0b35}
  button.b.alt{background:rgba(255,255,255,.12);box-shadow:none;font-size:15px}
  button.b.lime{background:linear-gradient(180deg,#d4ff3d,#8bc34a);color:#1a1026;box-shadow:0 4px 0 #4b6b12}
  .coins{display:inline-block;font-weight:800;background:rgba(255,212,0,.16);border:1px solid rgba(255,212,0,.5);border-radius:999px;padding:3px 10px;font-size:14px}
  .coinwin{font-weight:900;font-size:22px;color:#ffd400;margin:8px 0}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{font:inherit;color:#fff;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 2px;cursor:pointer;font-weight:900;font-style:italic;font-size:12px;letter-spacing:.04em}
  .seg button b{display:block;font-size:20px;font-style:normal;color:#c6ff00}
  .seg button.on{border-color:#ff2d95;background:rgba(255,45,149,.2)}
  .tabs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
  .tabs button{flex:1 1 auto;font:inherit;font-weight:800;font-size:12px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:7px 8px;cursor:pointer}
  .tabs button.on{background:rgba(198,255,0,.2);border-color:#c6ff00}
  #pv{width:100%;max-width:320px;aspect-ratio:320/220;border-radius:16px;display:block;margin:4px auto;background:radial-gradient(ellipse at 50% 85%,rgba(198,255,0,.18),rgba(0,0,0,.25) 70%)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
  .tile{background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:14px;padding:6px 4px;cursor:pointer;position:relative}
  .tile.sel{border-color:#c6ff00;background:rgba(198,255,0,.12)}
  .tile canvas{width:72px;height:72px;display:block;margin:0 auto}
  .tile .sw{width:44px;height:44px;border-radius:50%;margin:14px auto 12px;border:3px solid rgba(255,255,255,.4)}
  .tile .em{font-size:40px;height:72px;line-height:72px}
  .tile .ts{font-size:10px;line-height:1.25;color:#c6ff00;margin-top:2px}
  .tile .tn{font-size:12px;font-weight:800;line-height:1.2}
  .tile .tp{font-size:11px;color:#ffd400;margin-top:2px;font-weight:700}
  .tile .tp.own{color:#8f8aa3}
  .tile.lock canvas,.tile.lock .sw,.tile.lock .em{opacity:.55}
  .mat{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:14px;padding:8px 10px;margin:6px 0;cursor:pointer}
  .mat.sel{border-color:#c6ff00;background:rgba(198,255,0,.1)}
  .mat canvas{width:62px;height:40px;flex:none}

function pieceCol(m,type){const c=MATS[m].col;return type==='base'?shade(c,-.28):type==='torre'?shade(c,.08):c;}
/* vista lateral; x,y: esquina sup-izq en px */
function drawPiece(g,art,m,type,x,y,w,h,P,t,k){
  const prev=CM;CM=art==='bn'?gray:ident;
  const st=BOXST[art]||'cartoon',col=pieceCol(m,type);k=k||1;
  g.save();
  if(m==='gelatina'){const q=1+Math.sin(t*9+(P?P.id:0))*.035;g.translate(x+w/2,y+h);g.scale(1/q,q);g.translate(-(x+w/2),-(y+h));}
  let by=y,bh=h;
  if(type==='torre'){const mh=h*.12;by=y+mh;bh=h-mh;const mw=w/5;for(let i=0;i<3;i++)box(g,st,x+i*2*mw,y,mw,mh+k,col,k);}
  box(g,st,x,by,w,bh,col,k);
  g.save();g.beginPath();g.rect(x,by,w,bh);g.clip();
  const lc=CM(shade(col,-.4));g.strokeStyle=lc;g.lineWidth=Math.max(1,.5*k);
  if(type==='ladrillo'){const rows=2;for(let r=1;r<rows;r++){g.beginPath();g.moveTo(x,by+bh*r/rows);g.lineTo(x+w,by+bh*r/rows);g.stroke();}
    for(let r=0;r<rows;r++){const off=r%2?w/4:w/2;for(let xx=x+off;xx<x+w;xx+=w/2){g.beginPath();g.moveTo(xx,by+bh*r/rows);g.lineTo(xx,by+bh*(r+1)/rows);g.stroke();}}}
  else if(type==='base'){g.fillStyle=CM('#ffd400');for(let xx=x-bh;xx<x+w;xx+=bh*.8){g.beginPath();g.moveTo(xx,by+bh);g.lineTo(xx+bh*.4,by+bh);g.lineTo(xx+bh*.4+bh*.35,by+bh*.65);g.lineTo(xx+bh*.35,by+bh*.65);g.fill();}
    F(g,'#37474f');for(const xx of [x+w*.15,x+w*.85]){g.beginPath();g.arc(xx,by+bh*.3,Math.max(1,bh*.08),0,7);g.fill();}}
  else if(type==='pilar'){for(const f of [.3,.5,.7]){g.beginPath();g.moveTo(x+w*f,by+bh*.12);g.lineTo(x+w*f,by+bh*.88);g.stroke();}g.fillStyle=lc;g.fillRect(x,by+bh*.08,w,Math.max(1,bh*.04));g.fillRect(x,by+bh*.88,w,Math.max(1,bh*.04));}
  else if(type==='torre'){g.fillStyle=CM('#1a1026');g.fillRect(x+w*.45,by+bh*.25,w*.1,bh*.25);g.beginPath();g.moveTo(x,by+bh*.7);g.lineTo(x+w,by+bh*.7);g.stroke();}
  // textura de material
  if(st!=='pixel'){
    if(m==='madera'&&type!=='ladrillo'){g.strokeStyle=CM('rgba(110,55,15,.35)');for(let i=1;i<3;i++){g.beginPath();g.moveTo(x,by+bh*i/3);g.quadraticCurveTo(x+w/2,by+bh*i/3+bh*.06,x+w,by+bh*i/3);g.stroke();}}
    if(m==='hielo'){g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=Math.max(1,k*.8);g.beginPath();g.moveTo(x+w*.15,by+bh*.8);g.lineTo(x+w*.35,by+bh*.2);g.stroke();}
    if(m==='piedra'){g.fillStyle=CM('rgba(60,60,60,.4)');for(let i=0;i<5;i++){const a=(((P?P.id:1)+1)*9301+i*49297)%233280/233280,b=(((P?P.id:1)+3)*7919+i*104729)%233280/233280;g.beginPath();g.arc(x+w*a,by+bh*b,Math.max(1,bh*.06),0,7);g.fill();}}
    if(m==='gelatina'){g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(x+w*.3,by+bh*.25,w*.13,bh*.1,0,0,7);g.fill();}
    if(m==='acero'){g.fillStyle=CM('#37474f');for(const xx of [x+w*.12,x+w*.88]){g.beginPath();g.arc(xx,by+bh*.18,Math.max(1,k*.5),0,7);g.fill();}}
    if(m==='bambu'){g.strokeStyle=CM('rgba(51,105,30,.8)');g.beginPath();g.moveTo(x+w*.5,by);g.lineTo(x+w*.5,by+bh);g.stroke();}
  }else{
    g.fillStyle=CM(shade(col,-.25));for(let i=0;i<3;i++)g.fillRect(x+w*(.2+i*.25),by+bh*(.3+(i%2)*.3),k,k);
  }
  if(st==='doodle'){g.strokeStyle='rgba(20,20,30,.35)';g.lineWidth=Math.max(1,.35*k);for(let xx=x-bh;xx<x+w;xx+=3*k){g.beginPath();g.moveTo(xx,by+bh);g.lineTo(xx+bh,by);g.stroke();}}
  if(P){
    if(P.hp<P.max){g.strokeStyle='rgba(20,10,10,.85)';g.lineWidth=Math.max(1,.6*k);const n=Math.ceil((1-P.hp/P.max)*3);for(let i=0;i<n;i++){let cx=x+w*(.25+.25*i),cy=by;g.beginPath();g.moveTo(cx,cy);for(let q=0;q<4;q++){cx+=((i+q)%2?1:-1)*w*.06;cy+=bh*.26;g.lineTo(cx,cy);}g.stroke();}}
    if(P.wet>0){g.fillStyle='rgba(40,120,255,.35)';g.fillRect(x,by,w,bh);g.fillStyle='rgba(120,190,255,.9)';for(let i=0;i<2;i++){const yy=by+((t*30+i*17+P.id*7)%bh);g.fillRect(x+w*(.3+i*.4),yy,Math.max(1,k*.6),Math.max(2,k*1.2));}}
    if(P.frozen>0){g.fillStyle='rgba(225,250,255,.6)';g.fillRect(x,by,w,bh);g.strokeStyle='#ffffff';g.lineWidth=Math.max(1,.4*k);g.beginPath();g.moveTo(x+w*.2,by+bh*.5);g.lineTo(x+w*.8,by+bh*.5);g.moveTo(x+w*.5,by+bh*.15);g.lineTo(x+w*.5,by+bh*.85);g.stroke();}
    if(P.flash>0){g.fillStyle=`rgba(255,255,255,${P.flash})`;g.fillRect(x,by,w,bh);}
  }
  g.restore();
  if(P&&P.burn>0){for(let i=0;i<3;i++){const fx=x+w*(.2+i*.3),fh=bh*(.6+.4*Math.abs(Math.sin(t*12+i*2+P.id)));g.fillStyle='rgba(255,109,0,.9)';g.beginPath();g.moveTo(fx-w*.1,y);g.quadraticCurveTo(fx,y-fh*1.4,fx+w*.1,y);g.fill();g.fillStyle='rgba(255,224,77,.9)';g.beginPath();g.moveTo(fx-w*.05,y);g.quadraticCurveTo(fx,y-fh*.8,fx+w*.05,y);g.fill();}}
  g.restore();CM=prev;
}
/* vista desde arriba: cara superior */
function drawTop(g,art,m,type,x,y,s,k){
  const prev=CM;CM=art==='bn'?gray:ident;const st=BOXST[art]||'cartoon',col=pieceCol(m,type);k=k||1;
  box(g,st,x,y,s,s,col,k);
  const lc=CM(shade(col,-.45));g.strokeStyle=lc;g.fillStyle=lc;g.lineWidth=Math.max(1,.6*k);
  if(type==='ladrillo'){g.beginPath();g.moveTo(x+s/2,y+s*.1);g.lineTo(x+s/2,y+s*.9);g.moveTo(x+s*.1,y+s/2);g.lineTo(x+s*.9,y+s/2);g.stroke();}
  else if(type==='base'){g.lineWidth=Math.max(1.5,k);g.strokeRect(x+s*.15,y+s*.15,s*.7,s*.7);for(const [a,b] of [[.25,.25],[.75,.25],[.25,.75],[.75,.75]]){g.beginPath();g.arc(x+s*a,y+s*b,Math.max(1,s*.05),0,7);g.fill();}}
  else if(type==='pilar'){g.beginPath();g.arc(x+s/2,y+s/2,s*.3,0,7);g.stroke();g.beginPath();g.arc(x+s/2,y+s/2,s*.15,0,7);g.stroke();}
  else if(type==='torre'){F(g,shade(col,.15));g.beginPath();g.arc(x+s/2,y+s/2,s*.38,0,7);g.fill();g.strokeStyle=lc;g.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4;g.fillStyle=lc;g.fillRect(x+s/2+Math.cos(a)*s*.34-s*.05,y+s/2+Math.sin(a)*s*.34-s*.05,s*.1,s*.1);}F(g,'#1a1026');g.beginPath();g.arc(x+s/2,y+s/2,s*.12,0,7);g.fill();}
  CM=prev;
}

const GRAV=900,CH=46,WW=580,CEIL=470,COLS=6,ROWS=3,CW=26,LH=22,RX=5,RY=6,MAXLV=8,BATTLE_T=90;
const G={wx:'calma',mode:'gate',phase:null,t:0,P:null,C:null,parts:[],pops:[],proj:[],debris:[],bolts:[],banner:null,aim:{ang:.8,pow:.62},tool:'martillo',pieceSel:'ladrillo',drag:null,shake:0,camSc:0,bt:0,paused:false,wind:0,windT:0,lastLight:-1,winner:null,flash:0};

function makeTower(side,left,mat,look,name,budget,flagImg){
  const grid=[];for(let r=0;r<ROWS;r++){grid.push([]);for(let c=0;c<COLS;c++)grid[r].push({stack:[],shield:0,pop:0});}
  return{side,left,mat,look,name,grid,budget,flagImg,nextId:0,flag:{r:0,c:2,off:0,offD:0,yv:0,vy:0,fall:null,down:false},
    char:{off:0,offD:0,yv:0,vy:0,fall:null,ground:0,climb:0,stun:0,frozen:0,wet:0,shield:0,throwT:0,wob:0,kos:0},
    wall:null,cds:{},lastHit:-9,placed:0};
}
const dirOf=T=>T.side==='L'?1:-1;
const other=T=>T===G.P?G.C:G.P;
const cellH=cell=>cell.stack.reduce((s,p)=>s+p.lv,0);
const cellX=(T,r,c)=>T.left+r*RX+c*CW;
const cellY0=r=>r*RY;
function tryPlace(T,r,c,type,quiet){
  const P=PIECES[type],cell=T.grid[r][c];
  if(T.budget<P.cost){if(!quiet){toast('Sin presupuesto 🏗️');sfx('no');}return false;}
  if(type==='escudo'){if(cell.shield>=4){if(!quiet)toast('Esa columna ya tiene escudo');return false;}cell.shield+=hasAcc(T,'pincel')?4:2;}
  else{
    if(type==='base'&&cell.stack.length){if(!quiet){toast('La base va en el suelo');sfx('no');}return false;}
    if(cellH(cell)+P.lv>MAXLV){if(!quiet){toast('¡Muy alto! Máx. 8 pisos');sfx('no');}return false;}
    const M=MATS[T.mat],hp=Math.max(1,Math.round(M.hp*P.hp))+(hasPet(T,'castor')?1:0)+(type==='base'&&hasAcc(T,'pala')?2:0);
    cell.stack.push({id:T.nextId++,type,lv:P.lv,hp,max:hp,off:0,offD:0,yv:0,vy:0,wet:0,frozen:0,burn:0,burnT:0,flash:0});
  }
  T.budget-=P.cost;cell.pop=1;T.placed++;
  if(!quiet)sfx('place',type);
  return true;
}
function topPiece(T,r,c){const s=T.grid[r][c].stack;return s.length?s[s.length-1]:null;}
function topPos(T,r,c){
  const p=topPiece(T,r,c);
  return{x:cellX(T,r,c)+CW/2+(p?p.off+p.offD:0),y:p?p.yv+p.lv*LH:cellY0(r),p};
}
function flagPos(T){const f=T.flag;if(f.fall)return{x:f.fall.x,y:f.fall.y};const tp=topPos(T,f.r,f.c);return{x:tp.x-dirOf(T)*7+f.off+f.offD,y:Math.max(tp.y,f.yv)};}
function charPos(T){
  const c=T.char;
  if(c.fall)return{x:c.fall.x,y:c.fall.y};
  const tp=topPos(T,T.flag.r,T.flag.c);
  const x=tp.x+dirOf(T)*5+c.off+c.offD,y=Math.max(tp.y,c.yv);

const canThrow=T=>{const c=T.char;return !c.fall&&c.climb<=0&&c.stun<=0&&c.frozen<=0&&!G.winner;};

function buildBossFort(T,D){
  const lay=[[0,0,['base','ladrillo']],[0,1,['base','pilar']],[0,2,['base','pilar','torre']],[0,3,['base','torre','ladrillo']],[0,4,['base','pilar']],[0,5,['base','ladrillo']],
    [1,1,['pilar']],[1,2,['ladrillo','pilar']],[1,3,['pilar','ladrillo']],[1,4,['ladrillo','ladrillo']],[2,2,['ladrillo']],[2,3,['ladrillo']]];
  T.budget=9999;for(const [r,c,ts] of lay)for(const t of ts)tryPlace(T,r,c,t,true);T.budget=0;

}
function bossInteg(T){const f=T.flag;if(f.fall||f.down)return 0;const cell=T.grid[f.r][f.c],top=cell.stack[cell.stack.length-1];
  return cell.stack.reduce((a,p)=>a+Math.max(0,p.hp),0)+cell.shield*3+(top?Math.max(0,CW*.62-Math.abs(top.off))*.8:0);}
function cpuPlace(){
  const C=G.C;if(C.budget<4)return;
  // estrategia: base al centro, luego columnas centrales altas
  const tries=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=C.grid[r][c],h=cellH(cell);const w=(r===0?2:1)*(c>=1&&c<=4?2:1)*(h<5?1.5:.6);tries.push({r,c,w:w*rand(.5,1.5),h});}
  tries.sort((a,b)=>b.w-a.w);
  for(const tr of tries.slice(0,6)){
    const h=tr.h;let type;
    if(h===0&&C.budget>=8&&Math.random()<.5)type='base';
    else if(C.budget>=22&&Math.random()<.22&&h<=5)type='torre';
    else if(C.budget>=10&&Math.random()<.35&&h<=6)type='pilar';
    else if(C.budget>=15&&Math.random()<.08)type='escudo';

    if(tryPlace(C,tr.r,tr.c,type,true))return;
  }
}
function chooseFlagCell(T){

/* ---- daño, efectos y física ---- */
const GLOWRE=/^#(ff[0-9a-f]{4}|c6ff00|00e5ff|4fc3f7|e1f5fe|76ff03)$/i;
function part(x,y,vx,vy,col,sz,life,emoji){if(G.parts.length>[140,280,450][QUAL.lv])return;G.parts.push({x,y,vx,vy,col,sz,life,max:life,emoji,glow:!emoji&&GLOWRE.test(col)});}
function pop(x,y,txt,col){G.pops.push({x,y,txt,col:col||'#fff',life:1.1});}
function banner(txt,sub,dur){G.banner={txt,sub,t:0,dur:dur||1.4};}
function pieceAt(T,r,c,i){
  const s=T.grid[r][c].stack;let y=cellY0(r);for(let j=0;j<i;j++)y+=s[j].lv*LH;return y;
}
function damagePiece(T,r,c,i,d,why){
  const cell=T.grid[r][c],p=cell.stack[i];if(!p)return;
  p.hp-=d;p.flash=.9;
  if(p.hp<=0){
    const x=cellX(T,r,c)+CW/2+p.off,y=p.yv+p.lv*LH/2,col=MATS[T.mat].col;
    for(let k=0;k<14;k++)part(x,y,rand(-220,220),rand(40,320),col,rand(3,6),rand(.6,1));
    cell.stack.splice(i,1);sfx('break');
    afterRemove(T,r,c,i,false,0);
  }
}
function pushPiece(T,r,c,i,amt){
  const cell=T.grid[r][c],p=cell.stack[i];if(!p)return;
  const M=MATS[T.mat],P=PIECES[p.type];
  let m=M.mass*P.mass;if(p.frozen>0)m*=.65;
  let a=amt/m*(M.soft||1)*(M.slip||1);
  // lo que está encima se mueve algo con la pieza (fricción)
  p.off+=a;p.offD-=a;
  for(let j=i+1;j<cell.stack.length;j++){const q=cell.stack[j];q.off+=a*.35;q.offD-=a*.35;}
  if(Math.abs(p.off)>CW*.62){pushOff(T,r,c,i,Math.sign(p.off));return;}
  for(let j=cell.stack.length-1;j>i;j--){const q=cell.stack[j];if(Math.abs(q.off)>CW*.62)pushOff(T,r,c,j,Math.sign(q.off));}
}
function pushOff(T,r,c,i,dir){
  const cell=T.grid[r][c],p=cell.stack[i];if(!p)return;
  const x=cellX(T,r,c)+CW/2+p.off;
  G.debris.push({x,y:p.yv,w:CW,h:p.lv*LH,vx:dir*rand(90,170),vy:rand(60,160),rot:0,vr:dir*rand(3,6),art:T.look.art,m:T.mat,type:p.type,P:p,life:2.2});
  cell.stack.splice(i,1);sfx('collapse');G.shake=Math.max(G.shake,7);
  afterRemove(T,r,c,i,true,dir);
}
/* revisa bandera y personaje cuando se quita una pieza */
function afterRemove(T,r,c,i,pushed,dir){
  const f=T.flag;if(f.r!==r||f.c!==c)return;
  const s=T.grid[r][c].stack;
  const wasTop=i===s.length; // la pieza quitada era la de arriba
  if(wasTop&&pushed){flagFall(T,dir);charFall(T,dir,180);return;}
  if(!s.length){flagFall(T,dir||dirOf(other(T)));if(!T.char.fall)charFall(T,dir||1,120);}
}
function flagFall(T,dir){
  const f=T.flag;if(f.fall||f.down)return;
  const p=flagPos(T);f.fall={x:p.x,y:p.y,vx:dir*rand(80,150),vy:200,rot:0,vr:dir*5};
  sfx('collapse');banner(T===G.P?'¡TU BANDERA!':'¡BANDERA RIVAL!','¡se viene abajo!',1.2);
}
function charFall(T,dir,v){
  const c=T.char;if(c.fall||G.winner)return;
  const p=charPos(T);c.fall={x:p.x,y:p.y,vx:dir*v,vy:240,rot:0,vr:dir*7,rest:false};c.climb=0;c.kos++;
  if(T===G.C)SV.charKOs++;
  sfx('oof');pop(p.x,p.y+CH+10,T===G.P?'¡TE BOTARON!':'¡LO BOTASTE!','#ffd400');
}

/* lanzar */
function fire(T,tool,ang,pow){
  if(SKILLS[tool])return useSkill(T,tool,ang,pow);
  if(!canThrow(T)||T.cds[tool]>0)return false;
  const D=TOOLS[tool],c=T.char;
  let cdm=(c.wet>0?1.4:1)*(hasPet(T,'conejo')?.85:1);if(tool==='martillo'&&hasPet(T,'perro'))cdm*=.7;if(tool==='agua'&&hasPet(T,'pulpo'))cdm*=.6;if(tool==='rayo'&&hasPet(T,'dron'))cdm*=.8;if(tool==='martillo'&&hasAcc(T,'motosierra'))cdm*=.85;if(tool==='rayo'&&T.ab==='chispa')cdm*=.7;
  T.cds[tool]=D.cd*cdm;
  if(D.self){
    if(tool==='escudo'){c.shield=6;sfx('shield');pop(charPos(T).x,charPos(T).y+CH+14,'¡ESCUDO!','#00e5ff');}
    if(tool==='muralla'){T.wall={hp:hasAcc(T,'llave')?5:3,t:7,rise:0};sfx('wall');}
    return true;
  }
  const d=dirOf(T),p=charPos(T),v=320+pow*800;
  G.proj.push({x:p.x+d*12,y:p.y+36,vx:d*Math.cos(ang)*v,vy:Math.sin(ang)*v,tool,owner:T,age:0,bounces:0,pb:0,rot:0});
  c.throwT=.32;sfx('throw');return true;
}
function wallRect(T){if(!T.wall)return null;let top=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)top=Math.max(top,cellH(T.grid[r][c])*LH+cellY0(r));
  const x=T.side==='L'?T.left+COLS*CW+2*RX+14:T.left-22;return{x,w:8,h:(top+CH+30)*Math.min(1,T.wall.rise)};}
function updProj(dt){
  for(let i=G.proj.length-1;i>=0;i--){
    const p=G.proj[i];let done=false;(p.tr=p.tr||[]).push([p.x,p.y]);while(p.tr.length>[0,8,14][QUAL.lv])p.tr.shift();
    const sub=3;for(let s=0;s<sub&&!done;s++){
      const h=dt/sub;p.age+=h;
      const g=p.tool==='rayo'?GRAV*.55:GRAV;
      p.vy-=g*h;p.vx+=(p.nowind?0:G.wind)*h;p.x+=p.vx*h;p.y+=p.vy*h;p.rot+=h*12*Math.sign(p.vx||1);
      // rebote en paredes y techo ("las esquinas")
      if(p.x<4||p.x>WW-4){if(p.bounces<3){p.x=clamp(p.x,4,WW-4);p.vx*=-.72;p.vy*=.9;p.bounces++;sfx('block');part(p.x,p.y,0,0,'#ffffff',6,.25);}else{done=true;break;}}
      if(p.y>CEIL){p.y=CEIL;p.vy*=-.55;p.bounces++;sfx('block');}
      const opp=other(p.owner);
      // murallas
      for(const T of [opp,p.owner]){const wr=wallRect(T);if(!wr)continue;if(T===p.owner&&p.age<.4)continue;
        if(p.x>wr.x&&p.x<wr.x+wr.w&&p.y<wr.h&&p.y>0){T.wall.hp--;p.vx*=-.55;p.x+=Math.sign(p.vx)*10;sfx('block');pop(wr.x,wr.h+12,'¡BLOQUEADO!','#00e5ff');for(let k=0;k<8;k++)part(p.x,p.y,rand(-100,100),rand(0,200),'#00e5ff',4,.5);if(T.wall.hp<=0){T.wall=null;sfx('break');}break;}}
      // personajes
      for(const T of [opp,p.owner]){if(T===p.owner&&p.age<.45)continue;const c=T.char;if(c.fall&&c.fall.rest&&c.climb<=0){}
        const cp=charPos(T),bg=T.big||1;if(Math.abs(p.x-cp.x)<11*bg&&p.y>cp.y&&p.y<cp.y+CH*bg){hitChar(T,p);done=true;break;}}
      if(done)break;
      // banderas
      for(const T of [opp,p.owner]){if(T===p.owner&&p.age<.45)continue;if(T.flag.fall)continue;const fp=flagPos(T);
        if(Math.abs(p.x-fp.x)<6&&p.y>fp.y&&p.y<fp.y+34){hitFlag(T,p);done=true;break;}}
      if(done)break;
      // piezas
      let hp=false;
      for(const T of [opp,p.owner]){if(T===p.owner&&p.age<.4)continue;const h=findHit(T,p.x,p.y);if(h){hp=true;impact(p,T,h);break;}}
      if(hp){if(p.keep)p.keep=false;else{done=true;break;}}
      if(p.y<=0){groundHit(p);done=true;break;}
    }
    if(done||p.x<-100||p.x>WW+100)G.proj.splice(i,1);
  }
}
function findHit(T,x,y){
  for(let r=0;r<ROWS;r++){
    const c=Math.floor((x-cellX(T,r,0))/CW);if(c<0||c>=COLS)continue;
    const cell=T.grid[r][c];
    for(let i=cell.stack.length-1;i>=0;i--){const p=cell.stack[i];if(y>=p.yv-2&&y<=p.yv+p.lv*LH+2&&Math.abs(x-(cellX(T,r,c)+CW/2+p.off))<CW/2+3)return{r,c,i};}
  }
  return null;
}
function forArea(x,y,rad,fn){for(const T of [G.P,G.C])for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=T.grid[r][c];for(let i=cell.stack.length-1;i>=0;i--){const p=cell.stack[i];const px=cellX(T,r,c)+CW/2+p.off,py=p.yv+p.lv*LH/2;if(Math.hypot(px-x,py-y)<rad)fn(T,r,c,i,p);}}}
function charsNear(x,y,rad,fn){for(const T of [G.P,G.C]){const cp=charPos(T);if(Math.hypot(cp.x-x,cp.y+CH/2-y)<rad)fn(T);}}
function impact(p,T,h){
  const dir=Math.sign(p.vx)||1,cell=T.grid[h.r][h.c],pc=cell.stack[h.i],M=MATS[T.mat];
  // escudo de columna
  if(cell.shield>0&&p.tool!=='agua'){cell.shield--;sfx('block');pop(p.x,p.y+20,'🛡️ ¡ESCUDO!','#00e5ff');for(let k=0;k<8;k++)part(p.x,p.y,rand(-120,120),rand(0,200),'#00e5ff',4,.5);return;}
  T.lastHit=G.t;
  switch(p.tool){
    case 'martillo':{
      const mult=(pc.frozen>0?2:1)+(hasAcc(p.owner,'hacha')&&(T.mat==='madera'||T.mat==='bambu')?1:0)+(hasAcc(p.owner,'taladro')&&(T.mat==='piedra'||T.mat==='acero')?1:0)+(p.owner.ab==='tala'?1:0);sfx('hit',T.mat);G.shake=Math.max(G.shake,4);
      for(let k=0;k<6;k++)part(p.x,p.y,rand(-140,140)-dir*60,rand(30,200),M.col,rand(2,5),.5);
      if(pc.frozen>0)pop(p.x,p.y+26,'¡CRASH!','#e1f5fe');
      if(M.soft&&M.soft<.5){sfx('boing');pop(p.x,p.y+26,'¡BOING!','#76ff03');}
      pushPiece(T,h.r,h.c,h.i,dir*26*(pc.frozen>0?1.4:1)*(hasAcc(p.owner,'martillo')?1.15:1));
      const idx=cell.stack.indexOf(pc);if(idx>=0)damagePiece(T,h.r,h.c,idx,mult);
      if(p.owner.ab==='lava'&&cell.stack.indexOf(pc)>=0&&pc.wet<=0){pc.burn=Math.max(pc.burn,4);pop(p.x,p.y+40,'🌋 ¡ARDE!','#ff6d00');}
      // rebote si viene muy fuerte: puede volver a tu torre
      const sp=Math.hypot(p.vx,p.vy);
      if(sp>640&&p.pb<1){p.pb++;p.vx=-p.vx*.5;p.vy=Math.abs(p.vy)*.45+120;p.x+=Math.sign(p.vx)*14;p.keep=true;pop(p.x,p.y+40,'¡REBOTE!','#ffd400');}
      break;}
    case 'agua':
      sfx('splash');for(let k=0;k<18;k++)part(p.x,p.y,rand(-180,180),rand(20,260),'#4fc3f7',rand(3,6),.7);
      forArea(p.x,p.y,hasPet(p.owner,'pulpo')?80:52,(T2,r,c,i,q)=>{if(q.burn>0){q.burn=0;sfx('steam');pop(p.x,p.y+20,'¡FSSS!','#ddd');}q.wet=10*wv('wetDur',1);});
      charsNear(p.x,p.y,55,T2=>wetChar(T2));pop(p.x,p.y+26,'¡MOJADO!','#4fc3f7');break;
    case 'rayo':zap(p.x,p.y,T,h,p.owner);break;
    case 'viga':{sfx('hit',T.mat);sfx('wall');G.shake=Math.max(G.shake,9);for(let k=0;k<10;k++)part(p.x,p.y,rand(-160,160),rand(30,220),'#8d6e63',rand(3,6),.6);
      pushPiece(T,h.r,h.c,h.i,(Math.random()<.5?-1:1)*20);const idx=cell.stack.indexOf(pc);if(idx>=0)damagePiece(T,h.r,h.c,idx,2);pop(p.x,p.y+26,'¡CRASH!','#ffd400');break;}
    case 'meteoro':explode(p.x,p.y,60,3);break;
    case 'fuego':
      const fm=(wv('fire',1)===0&&hasPet(p.owner,'dragon')?1:wv('fire',1))*(hasPet(p.owner,'dragon')?1.5:1);
      if(fm===0){sfx('steam');pop(p.x,p.y+26,'¡LA LLUVIA LO APAGÓ!','#ddd');break;}

function zap(x,y,T,h,att){

      const list=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const s=T.grid[r][c].stack;s.forEach((q,i)=>{if((q.wet>0||M.cond)&&!(r===h.r&&c===h.c&&i===h.i))list.push([r,c,q]);});}
      list.slice(0,8).forEach(([r,c,q])=>{const i=T.grid[r][c].stack.indexOf(q);if(i>=0){G.bolts.push({x:cellX(T,r,c)+CW/2,y:q.yv+q.lv*LH/2,t:.3});damagePiece(T,r,c,i,1);}});
    }

  }

  if(wv('sway',0)){G.swayT=(G.swayT||0)+dt;if(G.swayT>2.2){G.swayT=0;for(const T of [G.P,G.C]){const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(cellH(T.grid[r][c])>=3)cells.push([r,c]);if(cells.length){const [r,c]=pick(cells),s=T.grid[r][c].stack;pushPiece(T,r,c,s.length-1,(Math.sign(G.wind)||1)*rand(3,6));}}}}
}

/* ---- CPU en batalla ---- */
function cpuThink(dt){
  const C=G.C,P=G.P,D=(G.D||DIFF[SV.diff]);
  G.cpuNext-=dt;if(G.cpuNext>0||!canThrow(C))return;
  G.cpuNext=D.cpuEvery*rand(.7,1.3)*(G.enraged?.75:1);
  // defensa
  if(G.t-C.lastHit<2.5&&C.cds.escudo<=0&&Math.random()<.4){fire(C,'escudo');return;}
  if(C.cds.muralla<=0&&Math.random()<.12){fire(C,'muralla');return;}
  // objetivo: la pieza bajo la bandera rival
  const f=P.flag;let tgt=null;
  const s=P.grid[f.r][f.c].stack;
  let wetIdx=-1;s.forEach((q,i)=>{if(q.wet>0)wetIdx=i;});
  let tool='martillo';
  if(wetIdx>=0&&C.cds.rayo<=0){tool='rayo';tgt=wetIdx;}
  else if(P.char.wet>0&&C.cds.rayo<=0&&Math.random()<.6){tool='rayo';tgt='char';}
  else if(C.cds.agua<=0&&Math.random()<.3){tool='agua';tgt=s.length-1;}
  else if(s.some(q=>q.frozen>0)&&C.cds.martillo<=0){tool='martillo';tgt=s.findIndex(q=>q.frozen>0);}
  else if(MATS[P.mat].burn&&C.cds.fuego<=0&&Math.random()<.3){tool='fuego';tgt=Math.max(0,s.length-2);}
  else if(C.cds.hielo<=0&&Math.random()<.2){tool='hielo';tgt=Math.random()<.5?'char':s.length-1;}
  else if(Math.random()<.15&&!P.char.fall)tgt='char';
  if(tool==='martillo'&&Math.random()<.45){const wx=G.wx;if((wx==='lluvia'||wx==='tormenta')&&C.cds.rayo<=0)tool='rayo';else if(wx==='sol'&&C.cds.fuego<=0&&MATS[P.mat].burn)tool='fuego';else if(wx==='nieve'&&C.cds.hielo<=0)tool='hielo';}
  if(tool==='martillo'&&C.ab==='chispa'&&C.cds.rayo<=0&&Math.random()<.4)tool='rayo';
  if(C.cds[tool]>0)tool='martillo';
  if(C.cds[tool]>0)return;
  let tx,ty;
  if(tgt==='char'||tgt==null||tgt<0||!s[tgt]){const cp=charPos(P);if(P.char.fall||tgt!=='char'&&!s.length){const fp=flagPos(P);tx=fp.x;ty=fp.y+10;}else{tx=cp.x;ty=cp.y+CH*.5;}}
  else{const q=s[tgt];tx=cellX(P,f.r,f.c)+CW/2+q.off;ty=q.yv+q.lv*LH*.5;}
  const p=charPos(C),x0=p.x-12,y0=p.y+36;
  const ang=rand(.55,1.0),g=tool==='rayo'?GRAV*.55:GRAV;
  let aimX=tx,v=600;
  for(let it=0;it<3;it++){const dx=x0-aimX,dy=ty-y0,c=Math.cos(ang),den=2*c*c*(dx*Math.tan(ang)-dy);v=den>0?Math.sqrt(g*dx*dx/den):900;const T=dx/(v*c);aimX=tx-.5*G.wind*T*T;}
  const er=D.err*(C.bossAb?.75:1);v*=1+randn()*er;
  if(hasPet(C,'loro')){v=v/(1+randn()*D.err)*(1+randn()*D.err*.6);}
  fire(C,tool,ang+randn()*D.err*.4,clamp((v-320)/800,0,1));
}

/* ---- update ---- */
function update(dt){
  G.t+=dt;JT=Math.floor(G.t*8)%3;
  const D=(G.D||DIFF[SV.diff]);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  G.flash=Math.max(0,G.flash-dt*2.5);
  for(const T of [G.P,G.C])for(const row of T.grid)for(const cell of row)cell.pop=Math.max(0,cell.pop-dt*5);
  if(G.phase==='ready'&&G.t>(G.readyT||1.6)){G.phase='build';G.bt=0;banner('¡CONSTRUYE!','elige pieza y toca la grilla',.9);updateHud(true);}
  if(G.phase==='build'){
    G.bt+=dt;const left=D.t-G.bt;
    while(G.cpuQ.length&&G.cpuQ[0]<=G.bt){G.cpuQ.shift();cpuPlace();}
    // alarmas de largada tipo F1: 5 luces en los últimos 3 s
    if(left<=3){const n=Math.min(5,Math.floor((3-left)/.6)+1);if(n!==G.lastLight){G.lastLight=n;sfx('light');if(n%2===1)sfx('siren');}}
    if(left<=0)launchBattle();
  }
  if(G.phase==='launch'){G.launchT+=dt;if(G.launchT>1.6){G.phase='battle';updateHud(true);}}
  if(G.phase==='battle'){
    G.battleT-=dt;
    G.windT+=dt;if(G.windT>10){G.windT=0;const wm=D.wind*wv('wind',1);G.wind=Math.round(clamp(G.wind+rand(-.6,.6)*wm,-wm,wm));}
    weatherTick(dt);
    for(const T of [G.P,G.C]){for(const k in T.cds)T.cds[k]=Math.max(0,T.cds[k]-dt);}
    cpuThink(dt);
    campTick(dt);
    if(G.battleT<=0)timeUp();
  }
  for(const T of [G.P,G.C])updTower(T,dt);
  updProj(dt);
  // escombros
  for(let i=G.debris.length-1;i>=0;i--){const d=G.debris[i];d.life-=dt;d.vy-=GRAV*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;if(d.y<0){d.y=0;d.vy*=-.3;d.vx*=.5;d.vr*=.5;}if(d.life<=0){for(let k=0;k<4;k++)part(d.x,4,rand(-80,80),rand(40,160),MATS[d.m].col,4,.6);G.debris.splice(i,1);}}
  for(let i=G.bolts.length-1;i>=0;i--){G.bolts[i].t-=dt;if(G.bolts[i].t<=0)G.bolts.splice(i,1);}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;p.vy-=GRAV*(p.emoji?.25:.8)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy*=-.3;p.vx*=.6;}if(p.life<=0){G.parts[i]=G.parts[G.parts.length-1];G.parts.pop();}}
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.life-=dt;p.y+=40*dt;if(p.life<=0)G.pops.splice(i,1);}
  G.shake=Math.max(0,G.shake-dt*25);
  // victoria: bandera en el suelo
  if((G.phase==='battle'||G.phase==='launch')&&!G.winner){
    const pd=G.P.flag.down,cd=G.C.flag.down;
    if(pd||cd)declare(pd&&cd?'draw':cd?'P':'C');
  }
  if(G.phase==='celebrate'){G.celebT+=dt;celebFx(dt);if(G.celebT>3.4)finish();}
}
function updTower(T,dt){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=T.grid[r][c];let acc=cellY0(r);
    for(let i=0;i<cell.stack.length;i++){
      const p=cell.stack[i],tgt=acc;acc+=p.lv*LH;
      if(G.phase==='build'||G.phase==='ready'){p.yv=tgt;}
      else if(p.yv>tgt+.01){p.vy+=1500*dt;p.yv=Math.max(tgt,p.yv-p.vy*dt);if(p.yv<=tgt+.01){if(p.vy>300){p.sq=1;sfx('hit',T.mat);for(let k=0;k<3;k++)part(cellX(T,r,c)+CW/2,tgt,rand(-50,50),rand(20,80),'rgba(255,255,255,.7)',3,.35);}p.vy=0;}}
      else{p.yv=tgt;p.vy=0;}
      p.sq=Math.max(0,(p.sq||0)-dt*4);p.offD*=Math.exp(-11*dt);p.flash=Math.max(0,p.flash-dt*4);
      if(G.phase==='battle'){
        if(p.wet>0)p.wet-=dt;if(p.frozen>0)p.frozen-=dt;
        if(p.termite>0){p.termite-=dt;p.termT=(p.termT||0)+dt;if(p.termT>1.4){p.termT=0;damagePiece(T,r,c,cell.stack.indexOf(p),1);if(cell.stack.indexOf(p)<0){i--;continue;}}}
        if(p.burn>0){p.burn-=dt;p.burnT+=dt;if(p.burnT>1.5){p.burnT=0;const idx=cell.stack.indexOf(p);damagePiece(T,r,c,idx,1);if(cell.stack.indexOf(p)<0){i--;continue;}}}
      }
    }
  }
  // bandera
  const f=T.flag;
  if(f.fall){f.fall.vy-=GRAV*dt;f.fall.x+=f.fall.vx*dt;f.fall.y+=f.fall.vy*dt;f.fall.rot+=f.fall.vr*dt;if(f.fall.y<=0){f.fall.y=0;f.fall.vx=0;f.fall.vr=0;if(!f.down){f.down=true;G.shake=10;}}}
  else if(G.phase!=='build'&&G.phase!=='ready'){const tp=topPos(T,f.r,f.c);if(f.yv>tp.y){f.vy+=1500*dt;f.yv=Math.max(tp.y,f.yv-f.vy*dt);}else{f.yv=tp.y;f.vy=0;}f.offD*=Math.exp(-9*dt);}
  // muralla
  if(T.wall){T.wall.rise=Math.min(1,T.wall.rise+dt*3);T.wall.t-=dt;if(T.wall.t<=0)T.wall=null;}
  // personaje
  const c=T.char;

const FITC=new Map();
function fitText(g,t,maxW,font,size,minS){
  const key=t+'|'+Math.round(maxW)+'|'+font(size);let r=FITC.get(key);
  if(!r){g.font=font(size);const mw=x=>g.measureText(x).width;let l=[t],w=mw(t);
    if(w>maxW){let best=null;for(const [sp,pen] of [[' · ',0],[': ',6],[' ',14]]){let k=t.indexOf(sp);while(k>0){const a=t.slice(0,k)+(sp===': '?':':''),b=t.slice(k+sp.length),m=Math.max(mw(a),mw(b))+pen;if(!best||m<best.m)best={m,l:[a,b]};k=t.indexOf(sp,k+1);}}
      if(best){l=best.l;w=Math.max(...l.map(mw));}}
    r={l,s:w>maxW?Math.max(minS||9,size*maxW/w):size};if(FITC.size>200)FITC.clear();FITC.set(key,r);}
  g.font=font(r.s);return r;}

  else if(k==='land'){tone(70,.5,'triangle',.7,35);[262,392,523,659].forEach((f,i)=>tone(f,1.4,'triangle',.16,0,.05+i*.05));[1568,2093,2637].forEach((f,i)=>tone(f,.5,'sine',.08,0,.35+i*.09));}
}
function introObra(){
  const cv=$('np1cv');if(!cv)return;
  const g=cv.getContext('2d'),W=420,H=340,GY=322,CX=210,BW=92,BH=27,N=5,R=54,HR=50;
  const TD=1.5,TL=1.85,TH0=2.2,TI=2.62,topY=GY-BH*N,restY=GY-BH-HR;
  const t0=performance.now()/1000,done=new Set(),once=(k,f)=>{if(!done.has(k)){done.add(k);f();}};
  const blocks=[],dust=[];let shake=0,flash=0,fx=CX,fy=GY,ring=-1,last=t0;
  for(let i=0;i<N;i++)blocks.push({i,x:CX+(i?(i%2?7:-7):0),y:GY-BH*(i+.5),ts:.25+i*.22,rot:0,vx:0,vy:0,vr:0,free:false,a:1});
  const E={y:-90,vy:0,rot:0,st:0};
  const puff=(x,y,n,c)=>{for(let k=0;k<n;k++)dust.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*170,l:1,c});};
  const boom=(x,y,f,s)=>{fx=x;fy=y;flash=f;shake=s;};
  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  function drawBlock(b,sx,sy,dx){
    g.save();g.globalAlpha=b.a;g.translate(b.x+dx,b.y);g.rotate(b.rot);g.scale(sx,sy);
    const gr=g.createLinearGradient(-BW/2,0,BW/2,0);gr.addColorStop(0,'#00e5ff');gr.addColorStop(1,'#7c4dff');
    rr(-BW/2,-BH/2+1,BW,BH-2,5);g.fillStyle='#0b1020';g.fill();g.strokeStyle=gr;g.lineWidth=3;g.stroke();
    g.fillStyle='rgba(0,229,255,.16)';g.fillRect(-BW/2+6,-BH/2+5,BW-12,4);
    g.fillStyle=gr;for(const x of[-BW/2+10,BW/2-10]){g.beginPath();g.arc(x,2,2.6,0,7);g.fill();}
    g.restore();
  }
  const HEX=[[60,5],[109,32],[109,88],[60,115],[11,88],[11,32]];
  function hex(){g.beginPath();HEX.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();}
  function drawEmblem(x,y,rot,halo){
    if(halo>0){const hg=g.createRadialGradient(x,y,R*.4,x,y,R*2.1);hg.addColorStop(0,'rgba(0,229,255,'+(.42*halo)+')');hg.addColorStop(1,'rgba(0,229,255,0)');g.fillStyle=hg;g.fillRect(x-R*2.2,y-R*2.2,R*4.4,R*4.4);}
    g.save();g.translate(x,y);g.rotate(rot);g.scale(R/60,R/60);g.translate(-60,-60);g.lineJoin='round';
    for(let i=6;i>=1;i--){const k=1-i/6,m=(a,b)=>Math.round(a+(b-a)*k);g.save();g.translate(i*1.1,i*1.5);hex();g.fillStyle='#0b1020';g.fill();g.strokeStyle='rgb('+m(62,0)+','+m(38,150)+','+m(128,170)+')';g.lineWidth=6;g.stroke();g.restore();}
    const g1=g.createLinearGradient(11,5,109,115);g1.addColorStop(0,'#00e5ff');g1.addColorStop(1,'#7c4dff');
    hex();g.fillStyle='#0b1020';g.fill();g.strokeStyle=g1;g.lineWidth=6;g.stroke();
    const g2=g.createLinearGradient(0,34,0,86);g2.addColorStop(0,'#ffe14d');g2.addColorStop(1,'#ff6d00');
    g.beginPath();g.moveTo(44,34);g.lineTo(44,86);g.lineTo(88,60);g.closePath();g.fillStyle=g2;g.fill();
    g.beginPath();g.arc(88,88,15,0,7);g.fillStyle='#ff1744';g.fill();g.strokeStyle='#0b1020';g.lineWidth=3;g.stroke();
    g.fillStyle='#fff';g.font='900 18px system-ui,sans-serif';g.textAlign='center';g.fillText('1',88,94);
    g.restore();
  }
  function drawHammer(x,y,rot,a){
    g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);
    g.fillStyle='#e9b06a';g.fillRect(-3,-4,6,36);
    const hg=g.createLinearGradient(-17,0,17,0);hg.addColorStop(0,'#ff4081');hg.addColorStop(1,'#ff1744');
    rr(-17,-16,34,18,4);g.fillStyle=hg;g.fill();g.strokeStyle='#0b1020';g.lineWidth=2;g.stroke();
    g.restore();
  }
  function frame(){
    if(G.mode!=='splash')return;
    const now=performance.now()/1000,t=now-t0,dt=Math.min(.05,now-last);last=now;
    g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);
    g.save();if(shake>0)g.translate((Math.random()-.5)*shake*10,(Math.random()-.5)*shake*10);
    const gw=150*clamp(t/.25,0,1),lg=g.createLinearGradient(CX-gw,0,CX+gw,0);lg.addColorStop(0,'rgba(0,229,255,0)');lg.addColorStop(.25,'#00e5ff');lg.addColorStop(.6,'#7c4dff');lg.addColorStop(1,'rgba(255,64,129,0)');
    g.fillStyle=lg;g.fillRect(CX-gw,GY,gw*2,3);
    if(t>=TI)once('hit',()=>{introSnd('crash');boom(CX-BW/2,GY-BH*2.5,1,1);puff(CX,GY-BH*2.5,22,'#ff4081');
      blocks.forEach(b=>{if(!b.i)return;b.free=true;b.vx=110+Math.random()*250+(b.i===2?120:0);b.vy=-(150+Math.random()*330);b.vr=(Math.random()-.3)*13;});
      E.st=3;E.vy=-270;});
    const sway=t>TL&&t<TI?Math.sin((t-TL)*15)*Math.exp(-(t-TL)*5):0;
    for(const b of blocks){
      if(b.free){
        b.vy+=1500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vr*dt;
        if(b.x>W-BW/2-4){b.x=W-BW/2-4;b.vx*=-.4;}
        if(b.y>GY-BH/2){b.y=GY-BH/2;if(b.vy>220)puff(b.x,GY,4,'#7c4dff');b.vy*=-.32;b.vx*=.55;b.vr*=.4;if(Math.abs(b.vy)<50){b.vy=0;b.rot+=(Math.round(b.rot/Math.PI)*Math.PI-b.rot)*.3;}}
        b.a=Math.max(.2,1-(t-TI-.45)*1.2);drawBlock(b,1,1,0);continue;
      }
      const k=(t-b.ts)/.28;if(k<=0)continue;
      if(k<1){const y=b.y;b.y=y-(1-k*k)*(y+60);drawBlock(b,1,1,0);b.y=y;continue;}
      once('b'+b.i,()=>{introSnd('thud');shake=Math.max(shake,.22);puff(b.x,b.y+BH/2,6,'#00e5ff');});
      const sq=Math.max(0,1-(t-b.ts-.28)/.14);drawBlock(b,1+.12*sq,1-.2*sq,sway*b.i*1.6);
    }
    if(t>=TH0&&t<TI+.5){once('sw',()=>introSnd('swing'));
      const hp=p=>{const x=-40+(CX-BW/2-14+40)*p,y=150+(GY-BH*2.5-150)*p-Math.sin(p*Math.PI)*80;return[x,y];};
      if(t<TI){const p=(t-TH0)/(TI-TH0);for(let j=4;j>=0;j--){const q=p-j*.05;if(q<0)continue;const[x,y]=hp(q);drawHammer(x,y,q*13,j?.16:1);}}
      else{const q=t-TI,[x,y]=hp(1);drawHammer(x-q*150,y-q*120+q*q*900,13-q*9,Math.max(0,1-q*2));}
    }
    if(t>=TD){
      if(E.st===0)E.st=1;
      if(E.st===1){const k=clamp((t-TD)/(TL-TD),0,1);E.y=-90+(topY-HR+90)*k*k;if(k>=1){E.st=2;once('cr',()=>{introSnd('crown');boom(CX,topY,.55,.3);puff(CX,topY,8,'#00e5ff');});}}
      else if(E.st===2)E.y=topY-HR;
      else if(E.st===3){E.vy+=1500*dt;E.y+=E.vy*dt;const k=clamp((t-TI)/.55,0,1);E.rot=Math.PI*2*(1-Math.pow(1-k,2));
        if(E.y>=restY){E.y=restY;once('ld',()=>{introSnd('land');boom(CX,restY,.8,.6);ring=0;puff(CX,GY-BH,16,'#00e5ff');});E.vy*=-.28;if(Math.abs(E.vy)<70){E.st=4;E.rot=0;}}}
      else E.y=restY;
      const sq=E.st===2?Math.max(0,1-(t-TL)/.14):0;
      drawEmblem(CX+(E.st===2?sway*N*1.6:0),E.y+sq*4,E.rot,E.st===4?.75+.25*Math.sin(t*3):E.st>=2?.5:.3);
    }
    if(ring>=0&&ring<1){g.strokeStyle='rgba(0,229,255,'+(1-ring)+')';g.lineWidth=4*(1-ring)+1;g.beginPath();g.arc(CX,restY,R+ring*38,0,7);g.stroke();ring+=dt*1.7;}
    for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.l-=dt*2.2;if(d.l<=0){dust.splice(i,1);continue;}d.vy+=500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;g.globalAlpha=d.l;g.fillStyle=d.c;g.beginPath();g.arc(d.x,d.y,2+d.l*2.5,0,7);g.fill();}
    g.globalAlpha=1;
    if(flash>0){const r=150,fg=g.createRadialGradient(fx,fy,0,fx,fy,r);fg.addColorStop(0,'rgba(255,255,255,'+flash*.85+')');fg.addColorStop(.4,'rgba(0,229,255,'+flash*.35+')');fg.addColorStop(1,'rgba(0,229,255,0)');g.fillStyle=fg;g.fillRect(fx-r,fy-r,r*2,r*2);flash-=dt*3.2;}
    shake=Math.max(0,shake-dt*3);
    g.restore();
    requestAnimationFrame(frame);
  }
  frame();
}
function endSplash(){if(G.mode!=='splash')return;const sp=$('splash');sp.classList.add('out');setTimeout(()=>sp.classList.add('hide'),450);showTitle();}

/* ---- logo TOWRIX que se arma con vigas, tuercas, tornillos y bandera ---- */
const LOGO=(()=>{const P=[];const off=i=>i*6.2;
  const pl=(li,arr,m)=>arr.forEach(a=>P.push({li,k:'pl',x1:a[0]+off(li),y1:a[1],x2:a[2]+off(li),y2:a[3],m:a[4]||m}));
  pl(0,[[0,.6,5,.6],[2.5,.6,2.5,7]],'w');
  P.push({li:1,k:'nut',cx:2.5+off(1),cy:3.5,r:3.3});
  pl(2,[[.5,0,1.3,7],[4.5,0,3.7,7],[1.3,7,2.5,2.8],[3.7,7,2.5,2.8]],'s');
  pl(3,[[.6,0,.6,7],[.1,.6,4.1,.6],[.1,3.6,4.1,3.6],[4.3,.1,4.3,4.1],[2.1,3.6,4.7,7]],'w');
  pl(4,[[2.5,0,2.5,7],[.8,.6,4.2,.6],[.8,6.4,4.2,6.4]],'s');
  pl(5,[[.3,0,4.7,7,'w'],[4.7,0,.3,7,'s']]);
  P.forEach((p,i)=>{p.ts=.15+i*.11;p.r0=Math.sin(i*7.3)*1.4;p.dx=Math.sin(i*3.1)*3;});
  return P;})();
const LOGO_DUR=LOGO[LOGO.length-1].ts+1.1;
let LOGO_T0=0;const LOGO_SFX=new Set();
function drawNut(g,R){
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6;g.lineTo(Math.cos(a)*R+R*.07,Math.sin(a)*R+R*.09);}g.fill();
  const gr=g.createLinearGradient(-R,-R,R,R);gr.addColorStop(0,'#f5f7f8');gr.addColorStop(.5,'#90a4ae');gr.addColorStop(1,'#37474f');
  g.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6;g.lineTo(Math.cos(a)*R,Math.sin(a)*R);}g.closePath();g.moveTo(R*.5,0);g.arc(0,0,R*.5,0,Math.PI*2,true);
  g.fillStyle=gr;g.fill('evenodd');g.strokeStyle='#1a1026';g.lineWidth=R*.07;g.stroke();
  g.strokeStyle='rgba(38,50,56,.7)';g.lineWidth=R*.05;g.setLineDash([R*.08,R*.06]);g.beginPath();g.arc(0,0,R*.57,0,7);g.stroke();g.setLineDash([]);
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-R*.45,-R*.55,R*.25,R*.08,-.5,0,7);g.fill();
}
function drawPlank(g,len,th,m,i,sk,u){
  const x=-len/2,y=-th/2;
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+.18*u,y+.22*u,len,th);
  if(m==='w'){const gr=g.createLinearGradient(0,y,0,y+th);gr.addColorStop(0,'#f2b872');gr.addColorStop(.5,'#c98a46');gr.addColorStop(1,'#8d5524');g.fillStyle=gr;g.fillRect(x,y,len,th);
    g.strokeStyle='rgba(90,45,10,.45)';g.lineWidth=u*.05;for(let k=1;k<4;k++){g.beginPath();g.moveTo(x,y+th*k/4);for(let q=1;q<=8;q++)g.lineTo(x+len*q/8,y+th*k/4+Math.sin(q*1.7+i+k)*th*.05);g.stroke();}
    g.fillStyle='rgba(90,45,10,.5)';g.beginPath();g.ellipse(x+len*(.3+(i%3)*.2),0,th*.18,th*.1,0,0,7);g.fill();
    g.strokeStyle='#1a1026';g.lineWidth=u*.1;g.strokeRect(x,y,len,th);}
  else{const gr=g.createLinearGradient(0,y,0,y+th);gr.addColorStop(0,'#f4ffb0');gr.addColorStop(.45,'#c6ff00');gr.addColorStop(1,'#8bc34a');g.fillStyle=gr;g.fillRect(x,y,len,th);
    g.fillStyle='rgba(26,16,38,.35)';g.fillRect(x,y+th*.18,len,th*.08);g.fillRect(x,y+th*.74,len,th*.08);
    g.fillStyle='#1a1026';for(let xx=x+u*.9;xx<x+len-u*.5;xx+=u*1.1){g.beginPath();g.arc(xx,0,th*.09,0,7);g.fill();}
    g.strokeStyle='#1a1026';g.lineWidth=u*.1;g.strokeRect(x,y,len,th);}
  if(sk>0)for(const sx of [x+th*.5,x+len-th*.5]){g.save();g.translate(sx,0);const z=.6+.4*sk;g.scale(z,z);g.rotate((1-sk)*9);const r=th*.24;
    const rg=g.createRadialGradient(-r*.3,-r*.3,1,0,0,r);rg.addColorStop(0,'#ffffff');rg.addColorStop(1,'#7d8a96');g.fillStyle=rg;g.beginPath();g.arc(0,0,r,0,7);g.fill();
    g.strokeStyle='#37474f';g.lineWidth=r*.25;g.beginPath();g.moveTo(-r*.6,0);g.lineTo(r*.6,0);g.moveTo(0,-r*.6);g.lineTo(0,r*.6);g.stroke();g.restore();}
  if(m==='w'&&sk>=1&&len>3*u){g.fillStyle='#cfd8dc';g.strokeStyle='#546e7a';g.lineWidth=1;for(const ny of [-th*.2,th*.2]){g.beginPath();g.arc(0,ny,th*.08,0,7);g.fill();g.stroke();}}
}
const LOGO_SET=LOGO[LOGO.length-1].ts+.7;let LOGOC=null;
function drawLogo(c,t,quiet){
  const g=c.getContext('2d'),w=c.width,h=c.height,u=w/38,ox=u*1,oy=h/2-1.6*u;
  g.clearRect(0,0,w,h);
  if(t>LOGO_SET){
    if(!LOGOC||LOGOC.width!==w||LOGOC.height!==h){LOGOC=document.createElement('canvas');LOGOC.width=w;LOGOC.height=h;drawLogoPieces(LOGOC.getContext('2d'),LOGO_SET+1,true,u,ox,oy);}
    if(!quiet)for(let i=0;i<LOGO.length;i++){LOGO_SFX.add(i);LOGO_SFX.add('s'+i);}
    g.drawImage(LOGOC,0,0);
  }else drawLogoPieces(g,t,quiet,u,ox,oy);
  drawLogoFlag(g,t,quiet,w,h,u,ox,oy);
}
function drawLogoPieces(g,t,quiet,u,ox,oy){
  LOGO.forEach((p,i)=>{
    const k=clamp((t-p.ts)/.38,0,1);if(k<=0)return;
    const e=1-Math.pow(1-k,3),dy=-(1-e)*9*u,rot=(1-e)*p.r0,dx=(1-e)*p.dx*u;
    if(!quiet&&k>=1&&!LOGO_SFX.has(i)){LOGO_SFX.add(i);sfx(p.k==='nut'?'nut':p.m==='w'?'thunk':'clang');}
    const sk=clamp((t-p.ts-.38)/.25,0,1);
    if(!quiet&&sk>0&&p.k!=='nut'&&!LOGO_SFX.has('s'+i)){LOGO_SFX.add('s'+i);sfx('screw');}
    g.save();
    if(p.k==='nut'){g.translate(ox+p.cx*u+dx,oy+p.cy*u+dy);g.rotate((1-e)*8);const z=.4+.6*e;g.scale(z,z);drawNut(g,p.r*u);}
    else{const x1=ox+p.x1*u,y1=oy+p.y1*u,x2=ox+p.x2*u,y2=oy+p.y2*u;g.translate((x1+x2)/2+dx,(y1+y2)/2+dy);g.rotate(Math.atan2(y2-y1,x2-x1)+rot);drawPlank(g,Math.hypot(x2-x1,y2-y1)+1.1*u,1.1*u,p.m,i,sk,u);}
    g.restore();
  });
}
function drawLogoFlag(g,t,quiet,w,h,u,ox,oy){
  const tf=LOGO[LOGO.length-1].ts+.55,fk=clamp((t-tf)/.45,0,1);
  if(fk>0){
    if(!quiet&&!LOGO_SFX.has('f')){LOGO_SFX.add('f');sfx('flagpop');}
    const e=fk<1?1+2.7*Math.pow(fk-1,3)+1.7*Math.pow(fk-1,2):1;
    const px=ox+(4*6.2+2.5)*u,py=oy-.1*u,ph=3.2*u*e;
    g.strokeStyle='#cfd8dc';g.lineWidth=u*.22;g.beginPath();g.moveTo(px,py);g.lineTo(px,py-ph);g.stroke();
    g.fillStyle='#ffd400';g.beginPath();g.arc(px,py-ph,u*.22,0,7);g.fill();
    const fw=2.6*u*e,fh=1.6*u*e;g.save();g.translate(px+u*.1,py-ph+u*.1);
    g.beginPath();g.moveTo(0,0);for(let q=0;q<=10;q++)g.lineTo(fw*q/10,Math.sin(t*6+q*.7)*u*.12*(q/10));for(let q=10;q>=0;q--)g.lineTo(fw*q/10,fh+Math.sin(t*6+q*.7)*u*.12*(q/10));g.closePath();
    g.fillStyle='#ff2d95';g.fill();g.strokeStyle='#1a1026';g.lineWidth=u*.06;g.stroke();
    g.fillStyle='#c6ff00';g.font=`900 ${fh*.7}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText('★',fw*.5,fh*.52+Math.sin(t*6+5)*u*.06);g.restore();
  }
  if(t>LOGO_DUR){const q=((t-LOGO_DUR)%4.5)/1.1;if(q<1){g.save();g.globalCompositeOperation='source-atop';const x=-w*.2+q*w*1.4;const gr=g.createLinearGradient(x-90,0,x+90,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);g.restore();}}
}

  <li><b>Gana quien bota la bandera rival al suelo:</b> empujando la pieza que la sostiene (estilo Jenga) o rompiendo toda esa columna.</li>
  <li>Si botan a tu personaje, sigues jugando: vuelve a subir en unos segundos.</li>
  <li>¡Ojo! Los lanzamientos fuertes rebotan en las paredes y en las piezas… y pueden caer en tu propia torre.</li></ol>
  <div class="combo"><b>Modo historia</b><br>Cada 10 etapas cambias de mundo: ${WORLDS.map(w=>w.ic+' '+w.n).join(' · ')}. Cada mundo tiene rivales con un poder propio. En las etapas 10, 20, 30… pelea un jefe final con su fortaleza ya armada: vencerlo te da una habilidad especial nueva y desbloquea su personaje. Cada etapa da hasta 3 ⭐: ganar, que no te boten y ganar en menos de 45 s.</div>
  <div class="combo"><b>Clima de la arena</b> (cambia cada 25 s)<br>${Object.values(WEATHER).map(w=>`${w.ic} <b>${w.n}</b>: ${w.d}`).join('<br>')}</div>
  <div class="combo"><b>Combos</b><br>💧 + ⚡ = daño ×3 en cadena y aturdimiento largo<br>💧 + ❄️ = congela más tiempo y agrieta<br>❄️ + 🔨 = se rompe doble y resbala<br>🔥 quema madera y bambú · derrite hielo · descongela personajes<br>⚡ en acero = ×2 · 🛡️ bloquea un golpe · 🧱 muralla frena 3</div>
  <div class="btns"><button class="b alt" data-act="close">VOLVER</button></div>`);
}
function showCredits(){
  showCard(`<h2>CRÉDITOS</h2><p><b>TOWRIX</b><br>Un juego de New Player One</p><p>Diseño y producción: Mitchel Muñoz Zúñiga<br>Desarrollo: New Player One + Claude</p><p>Música de batalla original: "Obra en Obra" y "Derrumbe" (New Player One)<br>Menús (dominio público, interpretadas por el juego desde la partitura): Satie, <i>Gymnopédie n.º 1</i> · Beethoven, <i>Para Elisa</i> y <i>Oda a la alegría</i> · Pachelbel, <i>Canon en re</i> · Petzold, <i>Minueto en sol</i> · Brahms, <i>Canción de cuna</i></p><p style="font-size:13px;opacity:.8">Tipografía Bungee © The Bungee Project Authors, licencia SIL Open Font License 1.1</p><p style="opacity:.6;font-size:13px">Prototipo v0.6 · 2026</p><div class="btns"><button class="b alt" data-act="close">VOLVER</button></div>`);
}
function pause(){G.paused=true;sfx('back');showCard(`<h2>PAUSA</h2><div class="btns"><button class="b lime" data-act="resume">CONTINUAR</button><button class="b alt" data-act="retry">REINICIAR</button><button class="b alt" data-act="menu">SALIR AL MENÚ</button></div>`,()=>ACT.resume());}
function showResult(){
  const r=G.result,D=G.D,cp=r.camp;
  const t=r.w==='P'?(cp&&cp.boss?'¡JEFE DERROTADO!':'¡VICTORIA!'):r.w==='C'?'¡DERRUMBADO!':'¡EMPATE LOCO!';
  const s=r.w==='P'?`La bandera de ${G.C.name} besó el suelo.`:r.w==='C'?`${G.C.name} botó tu bandera.`:'Nadie cedió.';
  let extra='',btns;
  if(cp){
    extra+=`<div class="starsr">${[1,2,3].map(i=>`<span class="${i<=cp.stars?'':'off'}">⭐</span>`).join('')}</div>`;
    if(cp.reward||cp.unlock||cp.newWorld!=null)extra+=`<div class="reward">${cp.reward?`${SKILLS[cp.reward].ic} Nueva habilidad: <b>${SKILLS[cp.reward].n}</b>. ${SKILLS[cp.reward].d}.<br>`:''}${cp.unlock?`🧑‍🔧 Nuevo personaje en el Taller: <b>${CAT.type.find(x=>x.id===cp.unlock).n}</b>.<br>`:''}${cp.newWorld!=null?`🗺️ ¡Nuevo mundo: <b>${WORLDS[cp.newWorld].ic} ${WORLDS[cp.newWorld].n}</b>!`:''}</div>`;
    btns=(cp.win?`<button class="b lime" data-act="next">SIGUIENTE ETAPA ▶</button><button class="b alt" data-act="retry">REPETIR ETAPA</button>`:`<button class="b lime" data-act="retry">REINTENTAR</button>`)+`<button class="b alt" data-act="camp">VER MAPA</button><button class="b alt" data-act="menu">MENÚ</button>`;
  }else btns=`<button class="b lime" data-act="retry">REVANCHA</button><button class="b alt" data-act="start_cfg">CAMBIAR DIFICULTAD / MATERIAL</button><button class="b alt" data-act="menu">MENÚ</button>`;
  showCard(`<h1>${t}</h1><p>${s}</p>${extra}<div class="chips"><span class="chip">${D.n}</span><span class="chip">🧱 te quedaron ${r.remaining} piezas</span><span class="chip">💫 rival botado ×${G.C.char.kos}</span><span class="chip">${MATS[G.P.mat].n}</span></div>
  <div class="coinwin">+${r.coins} 🪙</div><div class="btns">${btns}</div>`,()=>ACT.menu());
}

/* ================= PESTAÑA OCULTA ================= */
let acWasRunning=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(G.mode==='game'&&!G.paused&&$('ov').classList.contains('hide')&&['ready','build','launch','battle'].includes(G.phase))pause();
    if(AC&&AC.state==='running'){acWasRunning=true;AC.suspend().catch(()=>{});}
  }else{
    if(AC&&acWasRunning){acWasRunning=false;AC.resume().catch(()=>{});}
    last=performance.now();
  }
});

/* ================= LOOP ================= */
let last=performance.now();
function drawMini(c,mode,t){
  const g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);const L=SV.look;
  withArt(g,L.art,w,h,gg=>{
    drawPiece(gg,L.art,SV.mat,'base',w/2-60,h-44,120,32,{id:1,hp:1,max:1},t,2.6);
    drawChar(gg,w/2+10,h-44,140,L,{t});
  });
}
function loop(now){
  const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  if(G.mode==='game'&&!G.paused&&(SV.quality||'auto')==='auto'&&raw<.2){QUAL.acc+=raw;QUAL.n++;
    if(QUAL.n>=90){const avg=QUAL.acc/QUAL.n*1000;QUAL.acc=0;QUAL.n=0;
      if(avg>24&&QUAL.lv>0){QUAL.lv--;QUAL.good=0;resize();}
      else if(avg<11&&QUAL.lv<2){if(++QUAL.good>=4){QUAL.lv++;QUAL.good=0;resize();}}else QUAL.good=0;}}
  JT=Math.floor(now/125)%3;
  if(G.mode==='game'&&G.P){if(!G.paused)update(dt);render(dt);const hk=Math.floor(G.t*6);if(hk!==loop.hk){loop.hk=hk;updateHud();}}
  else if(G.mode==='title')drawLogo($('logoC'),now/1000-LOGO_T0);
  else if(G.mode==='menu'){if(!LOOPF.menuLogo){drawLogo($('mLogo'),LOGO_DUR+3,true);LOOPF.menuLogo=1;}if(now-LOOPF.mt>33){LOOPF.mt=now;drawMini($('aChar'),'menu',now/1000);}}
  const pv=$('pv');if(pv&&!$('ov').classList.contains('hide')&&now-LOOPF.pt>33){LOOPF.pt=now;const g=pv.getContext('2d');g.clearRect(0,0,640,440);const t=now/1000,L=previewLook();
    const cp=t-celebPrev<3.5&&tTab==='celeb'?L.celeb:null;
    withArt(g,L.art,640,440,gg=>{
      drawPiece(gg,L.art,SV.mat,'base',190,370,260,50,{id:2,hp:1,max:1},t,4);
      let rot=0,yy=370;if(cp==='voltereta'){const q=((t-celebPrev)*1.1)%1;yy-=Math.sin(q*Math.PI)*60;rot=q*Math.PI*2;}
      drawChar(gg,320,yy,260,L,{t,noPet:true,celeb:cp,ct:t-celebPrev,rot});
      if(L.pet!=='none'){gg.save();gg.translate(105,425);gg.scale(7,7);drawPet(gg,BOXST[L.art],L.pet,0,t);gg.restore();}
      // bandera
      gg.strokeStyle='#ddd';gg.lineWidth=5;gg.beginPath();gg.moveTo(560,420);gg.lineTo(560,250);gg.stroke();
      gg.fillStyle='#ff2d95';gg.fillRect(560,250,70,48);
      if(L.flag==='img'&&FLAGIMG&&FLAGIMG.complete)gg.drawImage(FLAGIMG,564,254,62,40);else{gg.font='34px system-ui';gg.textAlign='center';gg.textBaseline='middle';gg.fillText(L.flag==='img'?'⭐':L.flag,595,276);gg.textBaseline='alphabetic';}
    });
    if(cp==='confeti'||cp==='fuegos'||cp==='monedas'||cp==='guitarra'){const e={confeti:'🎊',fuegos:'🎆',monedas:'🪙',guitarra:'🎵'}[cp];g.font='40px system-ui';g.textAlign='center';for(let i=0;i<5;i++){const q=((t-celebPrev)*.8+i*.2)%1;g.globalAlpha=1-q;g.fillText(e,120+i*100,80+q*200);}g.globalAlpha=1;}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* ---- app Android: botón atrás y pausa al salir (los llama MainActivity) ---- */
window.onAndroidBack=function(){
  try{
    if(!$('ov').classList.contains('hide')){closeCardBack();return true;}
    if(G.mode==='game'){if(G.phase!=='over'&&!G.paused)pause();else toMenu();return true;}
    if(G.mode==='menu'){showTitle();return true;}
  }catch(e){}
  return false;
};
window.onAndroidPause=function(){try{if(G.mode==='game'&&!G.paused&&G.phase!=='over')pause();if(AC&&AC.state==='running')AC.suspend();}catch(e){}};
window.onAndroidResume=function(){try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}};
</script>
